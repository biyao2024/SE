server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: strict
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/face_attendance?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:face_attendance}
    password: ${DB_PASSWORD:}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Shanghai
  servlet:
    multipart:
      file-size-threshold: 1MB
      max-file-size: 200KB
      max-request-size: 650KB
  jackson:
    time-zone: Asia/Shanghai
  flyway:
    enabled: true
springdoc:
  swagger-ui:
    path: /api/docs
app:
  encryption-key: ${FACE_ENCRYPTION_KEY:}
  internal-key: ${INTERNAL_API_KEY:}
  algorithm-url: ${ALGORITHM_URL:http://127.0.0.1:8000}
  secure-cookie: ${COOKIE_SECURE:true}
  allowed-origins: ${APP_ALLOWED_ORIGIN:https://localhost}
  bootstrap-username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
  bootstrap-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
