worker_processes 1;
error_log .runtime/nginx-error.log warn;
pid .runtime/nginx.pid;

events { worker_connections 128; }

http {
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/x-icon ico;
        font/woff2 woff2;
    }
    default_type application/octet-stream;
    # Deliberately omit request URLs: WebSocket handshakes contain short-lived session IDs.
    log_format minimal '$remote_addr [$time_local] $request_method $status $body_bytes_sent';
    access_log .runtime/nginx-access.log minimal;
    server_tokens off;
    sendfile on;
    client_max_body_size 2m;
    client_body_buffer_size 2m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 443 ssl;
        server_name localhost;
        ssl_certificate deploy/certs/localhost.pem;
        ssl_certificate_key deploy/certs/localhost-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        root frontend/dist;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy 'camera=(self), microphone=()' always;

        location /api/v1/kiosk/stream {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 70s;
            proxy_send_timeout 70s;
            proxy_buffering off;
        }
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }
        # Spring Security restricts OpenAPI/Swagger to authenticated administrators.
        location /swagger-ui/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /v3/api-docs {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}

